<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Availability — Dial Residential</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --navy: #011E41;
    --blue: #007298;
    --teal: #5BB0BC;
    --pale-blue: #B8DBE5;
    --pale-gray: #DEDFE0;
    --cream: #DEDFE0;
    --line: #DEDFE0;
  }
  body {
    margin: 0;
    font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    color: var(--navy);
    background: transparent;
  }
  #app { max-width: 1180px; margin: 0 auto; padding: 4px 4px 16px; }

  .no-listings-note { font-size: 14px; color: #6b6a65; background: var(--cream); border-radius: 4px; padding: 16px 18px; text-align: center; }

  .carousel-wrap { position: relative; }
  .carousel-track {
    display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
    padding: 4px 4px 14px; -webkit-overflow-scrolling: touch;
  }
  .carousel-track::-webkit-scrollbar { height: 6px; }
  .carousel-track::-webkit-scrollbar-thumb { background: var(--pale-blue); border-radius: 3px; }

  .card {
    flex: 0 0 auto; width: 340px; scroll-snap-align: start;
    display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    overflow: hidden; box-shadow: 0 1px 4px rgba(1,30,65,0.06); transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 6px 20px rgba(1,30,65,0.14); transform: translateY(-2px); }

  .card .photo { position: relative; width: 100%; height: 210px; background: var(--pale-blue); }
  .card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .card .property-bar {
    padding: 11px 16px; color: #fff; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em;
    background: var(--navy);
  }

  .card .body { padding: 16px 18px 18px; flex: 1; display: flex; flex-direction: column; }
  .card .top-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .card .unit-name { font-size: 19px; font-weight: 500; color: var(--navy); }
  .card .rent { font-size: 16px; font-weight: 500; color: var(--navy); white-space: nowrap; }
  .card .specs { font-size: 12px; color: #8a8577; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 7px; }
  .card .avail { font-size: 13px; color: var(--blue); font-weight: 500; margin-bottom: 16px; }

  .card .cta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .cta-btn {
    flex: 1 1 auto; text-align: center; height: 38px; line-height: 36px; padding: 0 10px;
    border-radius: 3px; border: 1px solid var(--navy); background: #fff; color: var(--navy);
    font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .03em;
    font-family: 'Jost', sans-serif; text-decoration: none; cursor: pointer; white-space: nowrap;
    transition: background .12s, color .12s;
  }
  .cta-btn:hover { background: var(--navy); color: #fff; }
  .cta-btn.primary { background: var(--navy); color: #fff; }
  .cta-btn.primary:hover { background: var(--blue); border-color: var(--blue); }
  .cta-btn.disabled { opacity: .45; cursor: not-allowed; }
  .cta-btn.disabled:hover { background: #fff; color: var(--navy); }

  .carousel-btn {
    position: absolute; top: 105px; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%;
    background: rgba(184,219,229,0.92); border: none; color: var(--navy); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(1,30,65,0.25); z-index: 2;
    transition: background .12s;
  }
  .carousel-btn:hover { background: var(--pale-blue); }
  .carousel-btn.prev { left: -6px; }
  .carousel-btn.next { right: -6px; }

  @media (max-width: 480px) {
    .card { width: 78vw; }
    .carousel-btn { display: none; }
  }

  /* Inline unit detail view — shown in place of the carousel when "View Details" is clicked.
     No navigation ever happens: this fully replaces #content within the same iframe. */
  .back-btn {
    display: inline-block; margin-bottom: 16px; height: 34px; line-height: 32px; padding: 0 14px;
    border-radius: 3px; border: 1px solid var(--navy); background: #fff; color: var(--navy);
    font-size: 12px; font-weight: 500; font-family: 'Jost', sans-serif; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .back-btn:hover { background: var(--navy); color: #fff; }
  .detail-view { max-width: 780px; margin: 0 auto; }
  .detail-head { margin-bottom: 12px; }
  .detail-head .title { font-size: 22px; font-weight: 400; color: var(--navy); }
  .detail-head .sub { font-size: 12px; color: #6b6a65; margin: 2px 0 8px; }
  .status-badge {
    display: inline-block; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .03em;
    padding: 4px 10px; border-radius: 20px; background: var(--pale-blue); color: var(--navy);
  }
  .detail-grid { display: flex; gap: 24px; flex-wrap: wrap; }
  .detail-grid .plan { flex: 1 1 320px; min-width: 260px; }
  .detail-grid .plan img { width: 100%; border-radius: 4px; border: 1px solid var(--line); display: block; }
  .detail-grid .info { flex: 1 1 280px; min-width: 260px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-bottom: 16px; background: var(--line); border: 1px solid var(--line); }
  .stat-block { background: #fff; padding: 10px 8px; text-align: center; }
  .stat-block .v { font-size: 15px; font-weight: 500; color: var(--navy); }
  .stat-block .l { font-size: 10px; color: #8a8577; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .detail-view .cta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .detail-view .cta-row .cta-btn { flex: 1 1 140px; }
  .section-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: #8a8577; margin: 16px 0 6px; }
  .detail-description { font-size: 13px; line-height: 1.6; color: #3a3a38; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; padding: 5px 10px; border-radius: 20px; background: var(--pale-blue); color: var(--navy); }
  .fee-table { border-top: 1px solid var(--line); }
  .fee-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); color: #3a3a38; }
</style>
</head>

<div id="app">
  <div id="content"></div>
</div>

  function setupCarousel(){
    var track = document.getElementById("carousel-track");
    var wrap = track.closest(".carousel-wrap");
    var prevBtn = wrap.querySelector(".carousel-btn.prev");
    var nextBtn = wrap.querySelector(".carousel-btn.next");

    function cardStep(){
      var card = track.querySelector(".card");
      if (!card) return 340;
      var style = getComputedStyle(track);
      var gap = parseFloat(style.columnGap || style.gap || 20);
      return card.getBoundingClientRect().width + gap;
    }

    function atEnd(){
      return track.scrollLeft + track.clientWidth >= track.scrollWidth - 4;
    }

    prevBtn.addEventListener("click", function(){
      track.scrollBy({ left: -cardStep(), behavior: "smooth" });
    });
    nextBtn.addEventListener("click", function(){
      if (atEnd()){ track.scrollTo({ left: 0, behavior: "smooth" }); }
      else { track.scrollBy({ left: cardStep(), behavior: "smooth" }); }
    });

    function startAuto(){
      stopAuto();
      if (track.scrollWidth <= track.clientWidth + 4) return; // nothing to rotate
      autoTimer = setInterval(function(){
        if (atEnd()){ track.scrollTo({ left: 0, behavior: "smooth" }); }
        else { track.scrollBy({ left: cardStep(), behavior: "smooth" }); }
      }, 4500);
    }

    wrap.addEventListener("mouseenter", stopAuto);
    wrap.addEventListener("mouseleave", startAuto);
    wrap.addEventListener("touchstart", stopAuto, { passive: true });

    startAuto();
  }

        lastH = h;
        try { window.parent.postMessage({ sightmapHeight: h }, "*"); } catch(e){}
      }
    }
    var appEl = document.getElementById("app");
    if (appEl && window.ResizeObserver){
      new ResizeObserver(reportHeight).observe(appEl);
    } else {
      window.addEventListener("resize", reportHeight);
    }
    window.addEventListener("load", reportHeight);
    reportHeight();
  })();

})();
</script>
</body>
</html>
