name: Sync listings

# Daily: read AppFolio's public listings, update source/listings.json + the 3 widgets, publish.
# Also publishes on any push to main (e.g. a manual update), and can be run by hand
# from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "7 11 * * *"   # 11:07 UTC = 6:07am EST / 7:07am EDT
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-listings
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      skipped: ${{ steps.fetch.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install beautifulsoup4

      - name: Read AppFolio and update listings.json
        id: fetch
        run: |
          set +e
          python3 scripts/fetch_appfolio.py
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::Could not read AppFolio - nothing changed on the website. See the log above."
            exit 1
          fi
          echo "skipped=$([ "$code" = "2" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Rebuild widgets
        if: hashFiles('.sync-changes.txt') != ''
        run: python3 scripts/sync_listings.py

      - name: Monthly heartbeat (keeps GitHub from pausing the schedule)
        if: hashFiles('.sync-changes.txt') == '' && github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +"%Y-%m-%dT%H:%MZ" > source/heartbeat.txt
            echo "Monthly heartbeat" > .sync-changes.txt
          fi

      - name: Commit and push
        id: commit
        run: |
          git config user.name "Dial listings bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source site-files
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -F .sync-changes.txt
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (needs.sync.result == 'success' && needs.sync.outputs.changed == 'true') ||
       (github.event_name == 'workflow_dispatch' && needs.sync.result == 'success'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  flag-skipped-units:
    needs: [sync, deploy]
    if: always() && needs.sync.outputs.skipped == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::AppFolio lists a unit that can't be shown on the website maps (new unit without a floor plan, or another property). Everything else was published. See the 'Read AppFolio' step log for which unit."
          exit 1
